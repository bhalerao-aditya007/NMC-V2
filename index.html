<body>
    <div id="root"></div>
    <script type="text/babel">

        const { useState, useRef, useMemo } = React;
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // ==================== RULES CATALOG WITH RISK CATEGORIES ====================
        const RULES = [
            { id: 'R01', code: 'DIVERSION_OF_FUND', title: 'Diversion of fund across deposit works', riskCategory: 'HIGH', weight: 50, source: 'BEAMS / AMS Cashbook', param: 'Remark mismatch with work name' },
            { id: 'R02', code: 'WASTEFUL_SURVEY', title: 'Wasteful expenditure on Survey works', riskCategory: 'HIGH', weight: 50, source: 'BEAMS Capital Works', param: 'Survey remark + nil RA bill for other items' },
            { id: 'R03', code: 'EXCESS_WITHOUT_APPROVAL', title: 'Excess expenditure without Govt approval', riskCategory: 'HIGH', weight: 50, source: 'BEAMS UC', param: 'Expenditure > 110% of AA Amount' },
            { id: 'R04', code: 'OVERLAPPING_MAINTENANCE', title: 'Overlapping works / avoidable DLP maintenance', riskCategory: 'HIGH', weight: 50, source: 'BEAMS + Agreement', param: 'Same road + overlapping km' },
            { id: 'R05', code: 'DELAY_COMPLETION', title: 'Delay in completion of work', riskCategory: 'MEDIUM', weight: 30, source: 'BEAMS Capital Works', param: 'Stipulated completion < today' },
            { id: 'R06', code: 'SPLITTING_OF_WORK', title: 'Splitting of work to avoid tender process', riskCategory: 'HIGH', weight: 50, source: 'Agreement Register', param: 'Same contractor + same road + same year + < Rs.10L each' },
            { id: 'R07', code: 'NO_CENTAGE_RECOVERY', title: 'Non-recovery of centage charges', riskCategory: 'HIGH', weight: 50, source: 'BEAMS Deposit UC', param: 'Centage amount == 0 AND bill amount > 0' },
            { id: 'R08', code: 'UNSPENT_BALANCE', title: 'Unspent balance not returned to user dept', riskCategory: 'HIGH', weight: 50, source: 'BEAMS Deposit UC', param: 'Balance > Rs.1L AND remark contains "Work Completed"' },
            { id: 'R09', code: 'EXCESS_25_PERCENT', title: 'Excess expenditure >25% of contract cost', riskCategory: 'HIGH', weight: 50, source: 'BEAMS UC', param: 'Cumulative exp > 125% of contract cost' },
            { id: 'R10', code: 'ABANDONED_WORK', title: 'Abandoned work (no progress >3 years)', riskCategory: 'HIGH', weight: 50, source: 'BEAMS UC', param: 'Exp < 75% contract + last RA > 3 yrs' },
            { id: 'R11', code: 'INFLATED_SSR', title: 'Inflated SSR/DSR (excessive below-10% tenders)', riskCategory: 'HIGH', weight: 50, source: 'Agreement Register', param: '>20% works or cost below -10% tender' },
            { id: 'R12', code: 'PARKING_OF_FUND', title: 'Parking of fund (fag-end transfer)', riskCategory: 'HIGH', weight: 50, source: 'BEAMS Capital UC', param: 'Amount > Rs.50L to another division in March' },
            { id: 'R13', code: 'NO_DELAY_PENALTY', title: 'Non-imposition of penalties for delayed work', riskCategory: 'MEDIUM', weight: 30, source: 'BEAMS', param: 'RA bill date > stipulated completion date' },
            { id: 'R14', code: 'INSURANCE_LAPSE', title: 'Non-renewal of Insurance Policy / Bank Guarantee', riskCategory: 'MEDIUM', weight: 30, source: 'BEAMS', param: 'RA bill date > stipulated completion date' },
            { id: 'R15', code: 'SPLIT_HIGHER_SANCTION', title: 'Splitting to avoid higher-authority sanction', riskCategory: 'MEDIUM', weight: 30, source: 'BEAMS Capital Works', param: 'Adjacent km + same road + TS > Rs.1Cr each' },
            { id: 'R16', code: 'HAND_RECEIPT_PAYMENT', title: 'Irregular payment on Hand Receipt', riskCategory: 'MEDIUM', weight: 30, source: 'AMS Cash Book Form 10', param: 'Amount > Rs.10L + "paid vide HR"' },
            { id: 'R17', code: 'NO_CLASSIFICATION', title: 'Irregular payment without proper classification', riskCategory: 'LOW', weight: 20, source: 'AMS Cash Book Form 10', param: 'Amount > Rs.10L + empty Major Head column' },
            { id: 'R18', code: 'TS_BEFORE_AA', title: 'Technical Sanction prior to Administrative Approval', riskCategory: 'LOW', weight: 20, source: 'BEAMS UC', param: 'TS Date < AA Date' },
            { id: 'R19', code: 'BLOCKING_OF_FUNDS', title: 'Blocking of funds (deposit work, no expenditure)', riskCategory: 'MEDIUM', weight: 30, source: 'BEAMS Deposit UC', param: 'Cum exp == 0 AND balance > 0 AND receipt > 1 yr ago' },
            { id: 'R20', code: 'SHORT_RECEIPT_DEPOSIT', title: 'Short receipt of funds from user department', riskCategory: 'MEDIUM', weight: 30, source: 'BEAMS Deposit UC', param: 'Cumulative receipt < AA amount' }
        ];

        const RISK_WEIGHTS = { HIGH: 50, MEDIUM: 30, LOW: 20 };

        // ==================== HELPERS ====================
        function formatDate(d) {
            if (!d) return 'N/A';
            if (typeof d === 'string') return d;
            try { return d.toLocaleDateString('en-GB'); } catch(e) { return String(d); }
        }
        function normalizeAmount(v) {
            if (typeof v === 'number') return v;
            if (!v) return 0;
            const s = String(v).replace(/[Rs.,\s]/g, '').replace(/[()]/g, '');
            const n = parseFloat(s);
            return isNaN(n) ? 0 : n;
        }
        function parseDate(v) {
            if (!v) return null;
            if (v instanceof Date) return v;
            if (typeof v === 'number') {
                if (v > 30000 && v < 50000) {
                    const d = new Date((v - 25569) * 86400 * 1000);
                    d.setMinutes(d.getMinutes() + d.getTimezoneOffset());
                    return d;
                }
                return null;
            }
            const s = String(v).trim();
            const m1 = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
            if (m1) return new Date(parseInt(m1[3]), parseInt(m1[2]) - 1, parseInt(m1[1]));
            const m2 = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
            if (m2) return new Date(parseInt(m2[1]), parseInt(m2[2]) - 1, parseInt(m2[3]));
            const m3 = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2})$/);
            if (m3) { const y = parseInt(m3[3]); return new Date(2000 + y, parseInt(m3[2]) - 1, parseInt(m3[1])); }
            return null;
        }
        function findCol(row, candidates) {
            const keys = Object.keys(row);
            for (let c of candidates) {
                const re = new RegExp(c.replace(/\s+/g, '\\s*'), 'i');
                const key = keys.find(k => re.test(k));
                if (key !== undefined) return key;
            }
            return null;
        }
        function extractRoadDetails(name) {
            if (!name) return { roadCode: null, kmStart: null, kmEnd: null };
            const s = String(name);
            const roadMatch = s.match(/(MDR|SH|NH|VR|ODR|MSH)-?\s*(\d+)/i);
            const kmMatch = s.match(/[Kk][Mm][\s.]*(\d+[/\\.\d]+)\s*(?:to|To|TO|\-)[\s.]*(\d+[/\\.\d]+)/);
            const kmMatch2 = s.match(/[Kk][Mm][\s.]*(\d+[/\\.\d]+)[\s.]*(?:to|To|TO|\-)[\s.]*(\d+[/\\.\d]+)/);
            const km = kmMatch || kmMatch2;
            return {
                roadCode: roadMatch ? (roadMatch[1].toUpperCase() + roadMatch[2]) : null,
                kmStart: km ? km[1].replace('\\', '/') : null,
                kmEnd: km ? km[2].replace('\\', '/') : null
            };
        }
        function kmToDecimal(km) {
            if (!km) return null;
            const parts = String(km).replace('\\', '/').split('/');
            return parseFloat(parts[0]) + (parts[1] ? parseFloat(parts[1]) / 1000 : 0);
        }
        function kmOverlap(a1, a2, b1, b2) {
            const a = kmToDecimal(a1), b = kmToDecimal(a2), c = kmToDecimal(b1), d = kmToDecimal(b2);
            if (a === null || b === null || c === null || d === null) return false;
            return a <= d && b >= c;
        }
        function parsePercentBelowAbove(v) {
            if (!v) return null;
            const s = String(v).toLowerCase();
            const m = s.match(/(\d+(?:\.\d+)?)\s*%?\s*(below|above)/);
            if (m) return { pct: parseFloat(m[1]), direction: m[2] };
            if (s.includes('equal')) return { pct: 0, direction: 'equal' };
            return null;
        }

        // ==================== PARSERS ====================
        async function readExcel(file) {
            const ab = await file.arrayBuffer();
            const wb = XLSX.read(ab);
            const sheets = [];
            for (let sn of wb.SheetNames) {
                const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { raw: false, defval: '' });
                sheets.push({ name: sn, rows });
            }
            return sheets;
        }
        async function readPDF(file) {
            const ab = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: ab }).promise;
            let text = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const tc = await page.getTextContent();
                text += tc.items.map(it => it.str).join(' ') + '\n';
            }
            return text;
        }
        async function readDOCX(file) {
            const ab = await file.arrayBuffer();
            const res = await mammoth.extractRawText({ arrayBuffer: ab });
            return res.value;
        }

        // ==================== NORMALIZERS ====================
        function normalizeCapitalWorks(rows) {
            return rows.map(r => {
                const get = (cands) => { const k = findCol(r, cands); return k !== null ? r[k] : undefined; };
                const workName = get(['name of work', 'work name', 'work_name', 'name of the work']);
                if (!workName) return null;
                const rd = extractRoadDetails(String(workName));
                return {
                    type: 'capital',
                    work_id: get(['work id', 'work_id', 'budget item no', 'budget_item_no']),
                    work_name: String(workName).trim(),
                    road_code: rd.roadCode || get(['road code', 'road_code', 'road no']),
                    km_start: rd.kmStart || get(['km start', 'km_start', 'chainage from']),
                    km_end: rd.kmEnd || get(['km end', 'km_end', 'chainage to']),
                    aa_amount: normalizeAmount(get(['aa amount', 'aa_amount', 'administrative approval', 'approved cost'])),
                    aa_date: parseDate(get(['aa date', 'aa_date', 'date of aa'])),
                    tech_sanction_cost: normalizeAmount(get(['tech sanction cost', 'tech_sanction_cost', 'technical sanction amount', 'ts amount', 'technical sanction'])),
                    ts_date: parseDate(get(['ts date', 'ts_date', 'technical sanction date', 'date of technical sanction'])),
                    contract_cost: normalizeAmount(get(['contract cost', 'contract_cost', 'contract amount', 'agreement amount', 'agreement cost'])),
                    cumulative_expenditure: normalizeAmount(get(['cumulative expenditure', 'cumulative_expenditure', 'up to date expenditure', 'total expenditure', 'up-to-date expenditure'])),
                    work_order_date: parseDate(get(['work order date', 'work_order_date', 'date of work order'])),
                    time_limit_months: normalizeAmount(get(['time limit', 'time_limit_months', 'original time limit', 'time limit months'])) || 0,
                    stipulated_completion_date: parseDate(get(['stipulated completion date', 'stipulated_completion_date'])),
                    ra_bill_payment_date: parseDate(get(['ra bill payment date', 'ra_bill_payment_date', 'payment date', 'date of ra bill payment'])),
                    last_ra_bill_date: parseDate(get(['last ra bill date', 'last_ra_bill_date'])),
                    bill_amount: normalizeAmount(get(['bill amount', 'bill_amount', 'gross amount'])),
                    remark: String(get(['remark', 'remarks', 'status', 'progress']) || ''),
                    division: String(get(['division', 'pw division', 'pwd division']) || ''),
                    raw: r
                };
            }).filter(x => x);
        }
        function normalizeDepositWorks(rows) {
            return rows.map(r => {
                const get = (cands) => { const k = findCol(r, cands); return k !== null ? r[k] : undefined; };
                const workName = get(['name of work', 'work name', 'work_name']);
                if (!workName) return null;
                return {
                    type: 'deposit',
                    work_id: get(['deposit work id', 'work id', 'work_id']),
                    work_name: String(workName).trim(),
                    aa_amount: normalizeAmount(get(['aa amount', 'aa_amount', 'administrative approval'])),
                    cumulative_receipt_amount: normalizeAmount(get(['cumulative receipt amount', 'cumulative_receipt_amount', 'total receipt', 'amount received', 'receipt amount'])),
                    receipt_date: parseDate(get(['receipt date', 'receipt_date', 'date of receipt', 'fund received date'])),
                    bill_amount: normalizeAmount(get(['bill amount', 'bill_amount'])),
                    centage_amount: normalizeAmount(get(['centage amount', 'centage_amount', 'centage'])),
                    cumulative_expenditure: normalizeAmount(get(['cumulative expenditure', 'cumulative_expenditure', 'up to date expenditure', 'total expenditure'])),
                    balance_amount: normalizeAmount(get(['balance amount', 'balance_amount', 'unspent balance', 'balance amount with ddo'])),
                    remark: String(get(['remark', 'remarks', 'status']) || ''),
                    work_order_date: parseDate(get(['work order date', 'work_order_date'])),
                    division: String(get(['division', 'pw division']) || ''),
                    user_department: String(get(['user department', 'user_department']) || ''),
                    raw: r
                };
            }).filter(x => x);
        }
        function normalizeCashBook(rows) {
            return rows.map(r => {
                const get = (cands) => { const k = findCol(r, cands); return k !== null ? r[k] : undefined; };
                const amtVal = get(['amount', 'paid', 'debit', 'payment amount', 'rs']);
                const amt = normalizeAmount(amtVal);
                if (!amt || amt <= 0) return null;
                return {
                    type: 'cashbook',
                    voucher_no: get(['voucher no', 'voucher_no', 'voucher']),
                    date: parseDate(get(['date', 'voucher date'])),
                    amount: amt,
                    narration: String(get(['narration', 'particulars', 'description', 'details']) || ''),

                    payment_mode: String(get(['payment mode', 'payment_mode']) || ''),
                    raw: r
                };
            }).filter(x => x);
        }
        function normalizeAgreements(rows) {
            return rows.map(r => {
                const get = (cands) => { const k = findCol(r, cands); return k !== null ? r[k] : undefined; };
                const workName = get(['work name', 'work_name', 'name of work', 'description']);
                const agreementNo = get(['agreement no', 'agreement_no', 'agreement number', 'b1/']);
                if (!workName && !agreementNo) return null;
                const amt = normalizeAmount(get(['amount', 'contract amount', 'agreement amount', 'cost', 'value']));
                const pba = parsePercentBelowAbove(get(['% above or below', 'percent above below', 'above below', 'tender percent']));
                const yrMatch = String(agreementNo || '').match(/(\d{4}-\d{2})/);
                const year = yrMatch ? yrMatch[1] : String(get(['year', 'financial year']) || '');
                return {
                    type: 'agreement',
                    agreement_no: String(agreementNo || ''),
                    work_name: String(workName || ''),
                    amount: amt,
                    year: year,
                    contractor: String(get(['contractor', 'agency', 'name of contractor']) || ''),
                    percent_below_above: pba,
                    raw: r
                };
            }).filter(x => x);
        }

        // ==================== PDF TEXT PARSERS ====================
        function parsePDFUtilizationCerts(text) {
            const certs = [];
            const sections = text.split(/Utilisation Certificate/i);
            for (let i = 1; i < sections.length; i++) {
                const sec = sections[i];
                const idMatch = sec.match(/Deposit Work ID\s*:\s*(\S+)/i);
                const nameMatch = sec.match(/Name of Work\s*:\s*\n?\s*([^\n]+(?:\n[^\n]+)*?)(?=\n\s*User Department|\n\s*AA Amount)/i);
                const aaMatch = sec.match(/AA Amount.*?Rs\.\s*([\d,]+)/i);
                const contractMatch = sec.match(/Contract\s*(?:Cost|Amount)\s*(?:Rs\.)?\s*([\d,]+)/i);
                const expMatch = sec.match(/Up-to-date expenditure.*?=\s*Rs\.\s*([\d,]+)/i);
                const balMatch = sec.match(/balance amount of rupees with DDO\s*=\s*Rs\.\s*([\d,]+)/i);
                if (idMatch) {
                    const parseAmt = s => s ? parseInt(s.replace(/,/g, '')) : 0;
                    certs.push({
                        type: 'deposit',
                        work_id: idMatch[1],
                        work_name: nameMatch ? nameMatch[1].replace(/\n/g, ' ').trim() : '',
                        aa_amount: parseAmt(aaMatch && aaMatch[1]),
                        contract_cost: parseAmt(contractMatch && contractMatch[1]),
                        cumulative_expenditure: parseAmt(expMatch && expMatch[1]),
                        balance_amount: parseAmt(balMatch && balMatch[1]),
                        remark: '',
                        division: ''
                    });
                }
            }
            return certs;
        }
        function parsePDFCapitalWorks(text) {
            const works = [];
            const sections = text.split(/Work ID\s+(\w+\/\d+\/\d+\/\d+)/i);
            for (let i = 1; i < sections.length; i += 2) {
                const workId = sections[i];
                const content = sections[i + 1];
                if (!content) continue;
                const work = { type: 'capital', work_id: workId, work_name: '', aa_amount: 0, contract_cost: 0, cumulative_expenditure: 0, time_limit_months: 0, work_order_date: null, tech_sanction_cost: 0, ts_date: null, ra_bill_payment_date: null, last_ra_bill_date: null, remark: '', road_code: '', km_start: '', km_end: '' };
                const nameMatch = content.match(/Name Of The\s+Work\(English\)\s+([\s\S]+?)(?=Name Of The\s+Work\(Marathi\)|Administrative|AA Amount)/i);
                if (nameMatch) {
                    work.work_name = nameMatch[1].replace(/\n/g, ' ').trim();
                    const rd = extractRoadDetails(work.work_name);
                    work.road_code = rd.roadCode; work.km_start = rd.kmStart; work.km_end = rd.kmEnd;
                }
                const aaMatch = content.match(/AA Amount\s*\(Rs\.\)\s*([\d,]+)/i);
                if (aaMatch) work.aa_amount = parseInt(aaMatch[1].replace(/,/g, ''));
                const contractMatch = content.match(/(?:Contract|Agreement)\s*(?:Amount|Cost)\s*(?:Rs\.)?\s*([\d,]+)/i);
                if (contractMatch) work.contract_cost = parseInt(contractMatch[1].replace(/,/g, ''));
                const tsMatch = content.match(/Technical\s*Sanction\s*(?:Amount|Cost)?\s*(?:Rs\.)?\s*([\d,]+)/i);
                if (tsMatch) work.tech_sanction_cost = parseInt(tsMatch[1].replace(/,/g, ''));
                const timeMatch = content.match(/Original Time Limit In Days\s+(\d+)/i);
                if (timeMatch) work.time_limit_months = Math.ceil(parseInt(timeMatch[1]) / 30);
                const dateMatch = content.match(/Date Of Work\s+Order\s+([\d\-]+)/i);
                if (dateMatch) work.work_order_date = parseDate(dateMatch[1]);
                const expSection = content.split('Payment Details')[1];
                if (expSection) {
                    const lines = expSection.split('\n').map(l => l.trim()).filter(l => l);
                    let maxExp = 0, lastDate = null;
                    for (let line of lines) {
                        const dateInLine = parseDate(line);
                        if (dateInLine && (!lastDate || dateInLine > lastDate)) lastDate = dateInLine;
                        const amtMatch = line.match(/(\d{6,})/g);
                        if (amtMatch) {
                            const nums = amtMatch.map(n => parseInt(n));
                            const maxInLine = Math.max(...nums);
                            if (maxInLine > maxExp) maxExp = maxInLine;
                        }
                    }
                    work.cumulative_expenditure = maxExp;
                    work.ra_bill_payment_date = lastDate;
                    work.last_ra_bill_date = lastDate;
                }
                works.push(work);
            }
            return works;
        }
        function parsePDFAgreements(text) {
            const agreements = [];
            const lines = text.split('\n');
            for (let line of lines) {
                const agreementMatch = line.match(/B1\/(\d+)\s+OF\s+(\d{4}-\d{2})/i);
                if (agreementMatch) {
                    const parts = line.split(/\s{2,}/);
                    let workName = '', amount = 0, contractor = '';
                    for (let j = 0; j < parts.length; j++) {
                        if (parts[j].includes('OF')) { if (j+1 < parts.length) contractor = parts[j+1]; if (j+2 < parts.length) workName = parts[j+2]; break; }
                    }
                    const amountMatch = line.match(/([\d,]{6,})\s+(?:Below|Above|Equal)/i);
                    if (amountMatch) amount = parseInt(amountMatch[1].replace(/,/g, ''));
                    const pba = parsePercentBelowAbove(line);
                    if (workName || amount > 0) {
                        agreements.push({ type: 'agreement', agreement_no: `B1/${agreementMatch[1]} OF ${agreementMatch[2]}`, work_name: workName.trim(), amount, year: agreementMatch[2], contractor: contractor.trim(), percent_below_above: pba });
                    }
                }
            }
            return agreements;
        }
        function parsePDFCashBook(text) {
            const entries = [];
            const lines = text.split('\n');
            for (let line of lines) {
                const amtMatch = line.match(/Rs[\.\s]*([\d,]+(?:\.\d+)?)/);
                if (amtMatch) {
                    const amt = normalizeAmount(amtMatch[1]);
                    if (amt >= 100000) {
                        entries.push({ type: 'cashbook', amount: amt, narration: line.trim(), head_of_accounts: '', date: null });
                    }
                }
            }
            return entries;
        }

        // ==================== DETECTORS (ALL 20 RULES) ====================
        function detectR01(depositWorks) {
            const flags = [];
            for (let w of depositWorks) {
                const remark = (w.remark || '').toLowerCase();
                const workName = (w.work_name || '').toLowerCase();
                const diversionKeywords = ['transfer to', 'other division', 'unavoidable', 'contingencies', 'diversion'];
                const hasDiversion = diversionKeywords.some(k => remark.includes(k));
                if (hasDiversion) {
                    flags.push({ ruleId: 'R01', code: 'DIVERSION_OF_FUND', riskCategory: 'HIGH', work: w.work_name, details: `Deposit ID: ${w.work_id || 'N/A'}`, remark: 'Remark indicates funds diverted / transferred for purpose other than sanctioned work', evidence: `Remark: "${w.remark}" vs Work: "${w.work_name}"`, division: w.division });
                    continue;
                }
                const workTokens = workName.split(/\s+/).filter(t => t.length > 3 && !['work','construction','road','building','the','and','of','to','for'].includes(t));
                const remarkTokens = remark.split(/\s+/).filter(t => t.length > 3);
                if (remarkTokens.length > 0 && workTokens.length > 0) {
                    const overlap = workTokens.some(t => remarkTokens.includes(t));
                    if (!overlap && remark.length > 10) {
                        flags.push({ ruleId: 'R01', code: 'DIVERSION_OF_FUND', riskCategory: 'HIGH', work: w.work_name, details: `Deposit ID: ${w.work_id || 'N/A'}`, remark: 'Expenditure remark does not correspond to sanctioned work name – possible diversion', evidence: `Work: "${w.work_name}", Remark: "${w.remark}"`, division: w.division });
                    }
                }
            }
            return flags;
        }
        function detectR02(capitalWorks) {
            const flags = [];
            const constructionKeywords = ['construction','progress','crust','surfacing','bituminous','basecourse','widening','bridge','concrete','pavement','rebuilt'];
            for (let w of capitalWorks) {
                const remark = (w.remark || '').toLowerCase();
                if (remark.includes('survey')) {
                    const hasConstruction = constructionKeywords.some(k => remark.includes(k) || w.work_name.toLowerCase().includes(k));
                    if (!hasConstruction) {
                        flags.push({ ruleId: 'R02', code: 'WASTEFUL_SURVEY', riskCategory: 'HIGH', work: w.work_name, details: `Work ID: ${w.work_id || 'N/A'}`, remark: 'Expenditure only on survey work with no construction activity detected', evidence: `Remark: "${w.remark}", Cumulative Exp: Rs.${w.cumulative_expenditure.toLocaleString()}`, division: w.division });
                    }
                }
            }
            return flags;
        }
        function detectR03(works) {
            const flags = [];
            for (let w of works) {
                if (w.aa_amount > 0 && w.cumulative_expenditure > w.aa_amount * 1.10) {
                    const excess = ((w.cumulative_expenditure / w.aa_amount - 1) * 100).toFixed(1);
                    flags.push({ ruleId: 'R03', code: 'EXCESS_WITHOUT_APPROVAL', riskCategory: 'HIGH', work: w.work_name, details: `ID: ${w.work_id || 'N/A'}`, remark: `Expenditure exceeds AA amount by ${excess}% without Government approval`, evidence: `AA: Rs.${w.aa_amount.toLocaleString()}, Exp: Rs.${w.cumulative_expenditure.toLocaleString()}`, division: w.division });
                }
            }
            return flags;
        }
        function detectR04(capitalWorks, agreements) {
            const flags = [];
            const all = [];
            for (let w of capitalWorks) {
                if (w.road_code) all.push({ ...w, source: 'BEAMS' });
            }
            for (let a of agreements) {
                const rd = extractRoadDetails(a.work_name);
                if (rd.roadCode) all.push({ work_name: a.work_name, road_code: rd.roadCode, km_start: rd.kmStart, km_end: rd.kmEnd, source: 'Agreement', agreement_no: a.agreement_no, division: '' });
            }
            for (let i = 0; i < all.length; i++) {
                for (let j = i + 1; j < all.length; j++) {
                    const a = all[i], b = all[j];
                    if (a.road_code === b.road_code && kmOverlap(a.km_start, a.km_end, b.km_start, b.km_end)) {
                        flags.push({ ruleId: 'R04', code: 'OVERLAPPING_MAINTENANCE', riskCategory: 'HIGH', work: a.work_name, details: `Overlapping with: ${b.work_name} (${b.source})`, remark: `Both works on ${a.road_code} have overlapping chainages – possible duplication / avoidable DLP expenditure`, evidence: `A: ${a.km_start}-${a.km_end}, B: ${b.km_start}-${b.km_end}`, division: a.division || b.division });
                    }
                }
            }
            return flags;
        }
        function detectR05(capitalWorks) {
            const flags = [];
            const today = new Date();
            for (let w of capitalWorks) {
                const scd = w.stipulated_completion_date;
                if (!scd) continue;
                const isCompleted = (w.remark || '').toLowerCase().includes('completed');
                if (scd < today && !isCompleted) {
                    const days = Math.floor((today - scd) / (1000*60*60*24));
                    flags.push({ ruleId: 'R05', code: 'DELAY_COMPLETION', riskCategory: 'MEDIUM', work: w.work_name, details: `ID: ${w.work_id || 'N/A'}`, remark: `Work delayed by ${days} days beyond stipulated completion`, evidence: `Stipulated: ${formatDate(scd)}, Today: ${formatDate(today)}`, division: w.division });
                }
            }
            return flags;
        }
        function detectR06(agreements) {
            const flags = [];
            const groups = {};
            for (let a of agreements) {
                if (!a.contractor || !a.year) continue;
                const rd = extractRoadDetails(a.work_name);
                const key = `${a.contractor}|${rd.roadCode || 'UNK'}|${a.year}`;
                if (!groups[key]) groups[key] = [];
                groups[key].push(a);
            }
            for (let [key, list] of Object.entries(groups)) {
                const under10L = list.filter(a => a.amount > 0 && a.amount < 1000000);
                if (under10L.length >= 2) {
                    const total = under10L.reduce((s, a) => s + a.amount, 0);
                    flags.push({ ruleId: 'R06', code: 'SPLITTING_OF_WORK', riskCategory: 'HIGH', work: `${under10L[0].work_name}`, details: `${under10L.length} agreements to same contractor in ${under10L[0].year}`, remark: 'Works split into multiple sub-Rs.10 lakh contracts to avoid e-tendering', evidence: `Total: Rs.${total.toLocaleString()}, Agreements: ${under10L.map(a => a.agreement_no).join(', ')}`, division: '' });
                }
            }
            return flags;
        }
        function detectR07(depositWorks) {
            const flags = [];
            for (let w of depositWorks) {
                if (w.bill_amount > 0 && w.centage_amount === 0) {
                    flags.push({ ruleId: 'R07', code: 'NO_CENTAGE_RECOVERY', riskCategory: 'HIGH', work: w.work_name, details: `Deposit ID: ${w.work_id || 'N/A'}`, remark: '5% centage charges not recovered despite bill payments', evidence: `Bill: Rs.${w.bill_amount.toLocaleString()}, Centage: Rs.${w.centage_amount.toLocaleString()}`, division: w.division });
                }
            }
            return flags;
        }
        function detectR08(depositWorks) {
            const flags = [];
            for (let w of depositWorks) {
                if (w.balance_amount > 100000 && (w.remark || '').toLowerCase().includes('completed')) {
                    flags.push({ ruleId: 'R08', code: 'UNSPENT_BALANCE', riskCategory: 'HIGH', work: w.work_name, details: `Deposit ID: ${w.work_id || 'N/A'}`, remark: 'Work completed but unspent balance not returned to user department', evidence: `Balance: Rs.${w.balance_amount.toLocaleString()}`, division: w.division });
                }
            }
            return flags;
        }
        function detectR09(works) {
            const flags = [];
            for (let w of works) {
                const cc = w.contract_cost || w.aa_amount;
                if (cc > 0 && w.cumulative_expenditure > cc * 1.25) {
                    const excess = ((w.cumulative_expenditure / cc - 1) * 100).toFixed(1);
                    flags.push({ ruleId: 'R09', code: 'EXCESS_25_PERCENT', riskCategory: 'HIGH', work: w.work_name, details: `ID: ${w.work_id || 'N/A'}`, remark: `Expenditure exceeds contract cost by ${excess}%, beyond permissible 25% under Clause 38`, evidence: `Contract: Rs.${cc.toLocaleString()}, Exp: Rs.${w.cumulative_expenditure.toLocaleString()}`, division: w.division });
                }
            }
            return flags;
        }
        function detectR10(works) {
            const flags = [];
            const threeYearsAgo = new Date();
            threeYearsAgo.setFullYear(threeYearsAgo.getFullYear() - 3);
            for (let w of works) {
                const cc = w.contract_cost || w.aa_amount;
                if (cc > 0 && w.cumulative_expenditure < cc * 0.75) {
                    const lastDate = w.last_ra_bill_date || w.ra_bill_payment_date;
                    if (lastDate && lastDate < threeYearsAgo) {
                        flags.push({ ruleId: 'R10', code: 'ABANDONED_WORK', riskCategory: 'HIGH', work: w.work_name, details: `ID: ${w.work_id || 'N/A'}`, remark: `Only ${((w.cumulative_expenditure/cc)*100).toFixed(1)}% utilised; no payment in 3+ years – work appears abandoned`, evidence: `Last Payment: ${formatDate(lastDate)}, Contract: Rs.${cc.toLocaleString()}`, division: w.division });
                    }
                }
            }
            return flags;
        }
        function detectR11(agreements) {
            const flags = [];
            const byYear = {};
            for (let a of agreements) { if (a.year) { if (!byYear[a.year]) byYear[a.year] = []; byYear[a.year].push(a); } }
            for (let [year, list] of Object.entries(byYear)) {
                if (!list.length) continue;
                const totalCost = list.reduce((s, a) => s + a.amount, 0);
                const below10 = list.filter(a => a.percent_below_above && a.percent_below_above.direction === 'below' && a.percent_below_above.pct >= 10);
                if (!below10.length) continue;
                const pctWorks = (below10.length / list.length) * 100;
                const belowCost = below10.reduce((s, a) => s + a.amount, 0);
                const pctCost = totalCost > 0 ? (belowCost / totalCost) * 100 : 0;
                if (pctWorks > 20 || pctCost > 20) {
                    flags.push({ ruleId: 'R11', code: 'INFLATED_SSR', riskCategory: 'HIGH', work: `Year ${year} awarded works`, details: `Agreement Register – ${year}`, remark: `${below10.length}/${list.length} works (${pctWorks.toFixed(1)}%) accepted ≥10% below estimate; cost share ${pctCost.toFixed(1)}%. Estimates should be recast per Para 150.`, evidence: `Below-10%: ${below10.length}, Cost: Rs.${belowCost.toLocaleString()}/Rs.${totalCost.toLocaleString()}`, division: '' });
                }
            }
            return flags;
        }
        function detectR12(works) {
            const flags = [];
            for (let w of works) {
                const remark = (w.remark || '').toLowerCase();
                const isTransfer = remark.includes('transfer') || remark.includes('electrical division') || remark.includes('other division');
                const amt = w.bill_amount || w.cumulative_expenditure;
                if (isTransfer && amt >= 5000000) {
                    const date = w.ra_bill_payment_date || w.work_order_date;
                    const isMarch = date && date.getMonth() === 2;
                    if (isMarch || !date) {
                        flags.push({ ruleId: 'R12', code: 'PARKING_OF_FUND', riskCategory: 'HIGH', work: w.work_name, details: `ID: ${w.work_id || 'N/A'}`, remark: `Transfer of Rs.${amt.toLocaleString()} to another division in March – indicative of fund parking`, evidence: `Amount: Rs.${amt.toLocaleString()}, Date: ${formatDate(date)}, Remark: "${w.remark}"`, division: w.division });
                    }
                }
            }
            return flags;
        }
        function detectR13(capitalWorks) {
            const flags = [];
            for (let w of capitalWorks) {
                if (!w.ra_bill_payment_date || !w.stipulated_completion_date) continue;
                if (w.ra_bill_payment_date > w.stipulated_completion_date) {
                    const days = Math.floor((w.ra_bill_payment_date - w.stipulated_completion_date) / (1000*60*60*24));
                    flags.push({ ruleId: 'R13', code: 'NO_DELAY_PENALTY', riskCategory: 'MEDIUM', work: w.work_name, details: `ID: ${w.work_id || 'N/A'}`, remark: `RA bill paid ${days} days after stipulated completion. Contractor liable for damages.`, evidence: `RA Bill: ${formatDate(w.ra_bill_payment_date)}, Stipulated: ${formatDate(w.stipulated_completion_date)}`, division: w.division });
                }
            }
            return flags;
        }
        function detectR14(capitalWorks) {
            const flags = [];
            for (let w of capitalWorks) {
                if (!w.ra_bill_payment_date || !w.stipulated_completion_date) continue;
                if (w.ra_bill_payment_date > w.stipulated_completion_date) {
                    const days = Math.floor((w.ra_bill_payment_date - w.stipulated_completion_date) / (1000*60*60*24));
                    flags.push({ ruleId: 'R14', code: 'INSURANCE_LAPSE', riskCategory: 'MEDIUM', work: w.work_name, details: `ID: ${w.work_id || 'N/A'}`, remark: `Work delayed by ${days} days. Insurance Policy & Bank Guarantee must be renewed till completion per tender conditions.`, evidence: `Stipulated: ${formatDate(w.stipulated_completion_date)}, RA Bill: ${formatDate(w.ra_bill_payment_date)}`, division: w.division });
                }
            }
            return flags;
        }
        function detectR15(capitalWorks) {
            const flags = [];
            const byRoad = {};
            for (let w of capitalWorks) {
                if (!w.road_code) continue;
                if (!byRoad[w.road_code]) byRoad[w.road_code] = [];
                byRoad[w.road_code].push(w);
            }
            for (let [road, list] of Object.entries(byRoad)) {
                if (list.length < 2) continue;
                const sorted = [...list].sort((a, b) => (kmToDecimal(a.km_start) || 0) - (kmToDecimal(b.km_start) || 0));
                for (let i = 0; i < sorted.length - 1; i++) {
                    const w1 = sorted[i], w2 = sorted[i+1];
                    const ts1 = w1.tech_sanction_cost || w1.contract_cost || 0;
                    const ts2 = w2.tech_sanction_cost || w2.contract_cost || 0;
                    if (ts1 < 10000000 || ts2 < 10000000) continue;
                    const end1 = kmToDecimal(w1.km_end), start2 = kmToDecimal(w2.km_start);
                    if (end1 !== null && start2 !== null && (start2 - end1) <= 1.0) {
                        flags.push({ ruleId: 'R15', code: 'SPLIT_HIGHER_SANCTION', riskCategory: 'MEDIUM', work: `${road} adjacent works`, details: `${w1.work_name} & ${w2.work_name}`, remark: `Adjacent works on ${road} each with TS > Rs.1 Cr appear split to avoid higher authority sanction`, evidence: `TS1: Rs.${(ts1/1e7).toFixed(2)} Cr [${w1.km_start}-${w1.km_end}], TS2: Rs.${(ts2/1e7).toFixed(2)} Cr [${w2.km_start}-${w2.km_end}]`, division: w1.division || w2.division });
                    }
                }
            }
            return flags;
        }
        function detectR16(cashBook) {
            const flags = [];
            const hrRe = /paid\s+vide\s+(hand\s+receipt|h\.?r\.?)|\bhand\s+receipt\b|\bpaid\s+vide\s+hr\b/i;
            for (let e of cashBook) {
                if (e.amount >= 1000000 && hrRe.test(e.narration)) {
                    flags.push({ ruleId: 'R16', code: 'HAND_RECEIPT_PAYMENT', riskCategory: 'MEDIUM', work: 'Cash Book Form 10', details: `Voucher: ${e.voucher_no || 'N/A'}`, remark: `Payment of Rs.${e.amount.toLocaleString()} made via Hand Receipt. Huge payments on HR should be avoided per MPW Manual.`, evidence: `Amount: Rs.${e.amount.toLocaleString()}, Narration: "${e.narration}"`, division: '' });
                }
            }
            return flags;
        }
        function detectR17(cashBook) {
            const flags = [];
            for (let e of cashBook) {
                const head = (e.head_of_accounts || '').trim();
                const isEmpty = !head || head === '-' || head === 'n/a' || head === '0';
                if (e.amount >= 1000000 && isEmpty) {
                    flags.push({ ruleId: 'R17', code: 'NO_CLASSIFICATION', riskCategory: 'LOW', work: 'Cash Book Form 10', details: `Voucher: ${e.voucher_no || 'N/A'}`, remark: `Payment of Rs.${e.amount.toLocaleString()} without Major Head / classification entry`, evidence: `Amount: Rs.${e.amount.toLocaleString()}, Head: "${head || '(empty)'}"`, division: '' });
                }
            }
            return flags;
        }
        function detectR18(works) {
            const flags = [];
            for (let w of works) {
                if (w.ts_date && w.aa_date && w.ts_date < w.aa_date) {
                    flags.push({ ruleId: 'R18', code: 'TS_BEFORE_AA', riskCategory: 'LOW', work: w.work_name, details: `ID: ${w.work_id || 'N/A'}`, remark: 'Technical Sanction accorded prior to Administrative Approval – irregular approval sequence', evidence: `TS: ${formatDate(w.ts_date)}, AA: ${formatDate(w.aa_date)}`, division: w.division });
                }
            }
            return flags;
        }
        function detectR19(depositWorks) {
            const flags = [];
            const oneYearAgo = new Date();
            oneYearAgo.setFullYear(oneYearAgo.getFullYear() - 1);
            for (let w of depositWorks) {
                if (w.cumulative_expenditure === 0 && w.balance_amount > 0) {
                    const rd = w.receipt_date || w.work_order_date;
                    if (rd && rd < oneYearAgo) {
                        flags.push({ ruleId: 'R19', code: 'BLOCKING_OF_FUNDS', riskCategory: 'MEDIUM', work: w.work_name, details: `Deposit ID: ${w.work_id || 'N/A'}`, remark: 'Funds received but no expenditure for over 1 year – blocking of government funds', evidence: `Balance: Rs.${w.balance_amount.toLocaleString()}, Receipt: ${formatDate(rd)}`, division: w.division });
                    }
                }
            }
            return flags;
        }
        function detectR20(depositWorks) {
            const flags = [];
            for (let w of depositWorks) {
                if (w.cumulative_receipt_amount > 0 && w.aa_amount > 0 && w.cumulative_receipt_amount < w.aa_amount) {
                    const short = w.aa_amount - w.cumulative_receipt_amount;
                    flags.push({ ruleId: 'R20', code: 'SHORT_RECEIPT_DEPOSIT', riskCategory: 'MEDIUM', work: w.work_name, details: `Deposit ID: ${w.work_id || 'N/A'}`, remark: `Short receipt of Rs.${short.toLocaleString()} from user department against AA`, evidence: `AA: Rs.${w.aa_amount.toLocaleString()}, Received: Rs.${w.cumulative_receipt_amount.toLocaleString()}, Shortfall: Rs.${short.toLocaleString()}`, division: w.division });
                }
            }
            return flags;
        }

        // ==================== MAIN DETECTION ENGINE ====================
        async function detectAllRedFlags(files) {
            let capitalWorks = [], depositWorks = [], cashBook = [], agreements = [];

            for (let [fname, file] of Object.entries(files)) {
                const ext = fname.split('.').pop().toLowerCase();
                if (ext === 'xlsx' || ext === 'xls') {
                    const sheets = await readExcel(file);
                    for (let sheet of sheets) {
                        const rows = sheet.rows;
                        if (!rows.length) continue;
                        const headers = Object.keys(rows[0]).join(' ').toLowerCase();
                        if (headers.includes('deposit') || headers.includes('centage') || headers.includes('balance amount')) {
                            depositWorks.push(...normalizeDepositWorks(rows));
                        } else if (headers.includes('cash') || headers.includes('voucher') || headers.includes('form 10')) {
                            cashBook.push(...normalizeCashBook(rows));
                        } else if (headers.includes('agreement') || headers.includes('contractor') || headers.includes('b1/')) {
                            agreements.push(...normalizeAgreements(rows));
                        } else {
                            capitalWorks.push(...normalizeCapitalWorks(rows));
                        }
                    }
                } else if (ext === 'pdf') {
                    const text = await readPDF(file);
                    if (text.includes('Utilisation Certificate')) depositWorks.push(...parsePDFUtilizationCerts(text));
                    if (text.includes('Payment Details') || text.includes('Work ID')) capitalWorks.push(...parsePDFCapitalWorks(text));
                    if (text.includes('Agreement No') || text.includes('B1/')) agreements.push(...parsePDFAgreements(text));
                    if (text.includes('Form 10') || text.includes('Cash Book')) cashBook.push(...parsePDFCashBook(text));
                } else if (ext === 'docx') {
                    const text = await readDOCX(file);
                    agreements.push(...parsePDFAgreements(text));
                }
            }

            const flags = [
                ...detectR01(depositWorks),
                ...detectR02(capitalWorks),
                ...detectR03([...capitalWorks, ...depositWorks]),
                ...detectR04(capitalWorks, agreements),
                ...detectR05(capitalWorks),
                ...detectR06(agreements),
                ...detectR07(depositWorks),
                ...detectR08(depositWorks),
                ...detectR09([...capitalWorks, ...depositWorks]),
                ...detectR10([...capitalWorks, ...depositWorks]),
                ...detectR11(agreements),
                ...detectR12([...capitalWorks, ...depositWorks]),
                ...detectR13(capitalWorks),
                ...detectR14(capitalWorks),
                ...detectR15(capitalWorks),
                ...detectR16(cashBook),
                ...detectR17(cashBook),
                ...detectR18([...capitalWorks, ...depositWorks]),
                ...detectR19(depositWorks),
                ...detectR20(depositWorks)
            ];

            return {
                flags,
                totalFiles: Object.keys(files).length,
                documentsAnalyzed: { capitalWorks: capitalWorks.length, depositWorks: depositWorks.length, agreements: agreements.length, cashBook: cashBook.length }
            };
        }

        // ==================== DIVISION RISK SCORING ====================
        function calculateDivisionRiskScores(flags) {
            const divisionScores = {};
            for (let f of flags) {
                const div = f.division || 'Unknown Division';
                if (!divisionScores[div]) {
                    divisionScores[div] = { division: div, high: 0, medium: 0, low: 0, totalScore: 0, flags: [] };
                }
                divisionScores[div].flags.push(f);
                if (f.riskCategory === 'HIGH') { divisionScores[div].high++; divisionScores[div].totalScore += 50; }
                else if (f.riskCategory === 'MEDIUM') { divisionScores[div].medium++; divisionScores[div].totalScore += 30; }
                else if (f.riskCategory === 'LOW') { divisionScores[div].low++; divisionScores[div].totalScore += 20; }
            }
            return Object.values(divisionScores).sort((a, b) => b.totalScore - a.totalScore);
        }

        // ==================== PDF REPORT GENERATOR ====================
        function generatePDF(results) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
            const pageW = doc.internal.pageSize.getWidth();
            const pageH = doc.internal.pageSize.getHeight();
            const margin = 14;
            const cw = pageW - 2 * margin;
            let y = 0;
            function checkSpace(need) { if (y + need > pageH - 14) { doc.addPage(); y = 18; return true; } return false; }
            function drawText(text, x, fontSize, color, bold, maxW) {
                doc.setFontSize(fontSize);
                doc.setTextColor(...color);
                doc.setFont(undefined, bold ? 'bold' : 'normal');
                const lines = doc.splitTextToSize(String(text), maxW || cw);
                for (let line of lines) { checkSpace(fontSize * 0.4 + 1); doc.text(line, x, y); y += fontSize * 0.38 + 0.6; }
            }

            // Header
            doc.setFillColor(255, 154, 118);
            doc.rect(0, 0, pageW, 38, 'F');
            doc.setFontSize(18); doc.setTextColor(255, 255, 255); doc.setFont(undefined, 'bold');
            doc.text('Red Flag Detection System', pageW / 2, 14, { align: 'center' });
            doc.setFontSize(10); doc.setFont(undefined, 'normal');
            doc.text('Comptroller & Auditor General of India — PWD Compliance Audit', pageW / 2, 22, { align: 'center' });
            doc.text(`Generated: ${new Date().toLocaleString('en-IN', { dateStyle: 'long', timeStyle: 'short' })}`, pageW / 2, 30, { align: 'center' });
            y = 44;

            // Summary box
            doc.setFillColor(255, 248, 245); doc.setDrawColor(255, 154, 118);
            doc.roundedRect(margin, y, cw, 16, 2, 2, 'FD');
            doc.setFontSize(9); doc.setTextColor(60, 60, 60); doc.setFont(undefined, 'normal');
            const sev = { critical: results.flags.filter(f => f.riskCategory === 'HIGH').length, high: results.flags.filter(f => f.riskCategory === 'MEDIUM').length, medium: results.flags.filter(f => f.riskCategory === 'LOW').length };
            const meta = `Files: ${results.totalFiles}  |  Capital Works: ${results.documentsAnalyzed.capitalWorks}  |  Deposit Works: ${results.documentsAnalyzed.depositWorks}  |  Agreements: ${results.documentsAnalyzed.agreements}  |  Cash Book: ${results.documentsAnalyzed.cashBook}`;
            doc.text(meta, pageW / 2, y + 6, { align: 'center' });
            doc.text(`Total Flags: ${results.flags.length}  |  HIGH Risk: ${sev.critical}  |  MEDIUM Risk: ${sev.high}  |  LOW Risk: ${sev.medium}`, pageW / 2, y + 12, { align: 'center' });
            y += 22;

            // Division Risk Score Table
            const divScores = calculateDivisionRiskScores(results.flags);
            if (divScores.length > 0) {
                checkSpace(20);
                doc.setFillColor(230, 81, 0); doc.rect(margin, y, cw, 9, 'F');
                doc.setFontSize(11); doc.setTextColor(255, 255, 255); doc.setFont(undefined, 'bold');
                doc.text('Division-wise Risk Ranking (Weighted Score: HIGH=50, MEDIUM=30, LOW=20)', margin + 4, y + 6.5);
                y += 12;

                doc.setFontSize(9); doc.setTextColor(40, 40, 40); doc.setFont(undefined, 'bold');
                doc.text('Rank', margin + 2, y);
                doc.text('Division', margin + 18, y);
                doc.text('HIGH', margin + 80, y);
                doc.text('MEDIUM', margin + 100, y);
                doc.text('LOW', margin + 122, y);
                doc.text('Total Score', margin + 145, y);
                y += 5;

                doc.setFont(undefined, 'normal');
                for (let [idx, ds] of divScores.entries()) {
                    checkSpace(6);
                    doc.setTextColor(40, 40, 40);
                    doc.text(String(idx + 1), margin + 2, y);
                    doc.text(ds.division.substring(0, 35), margin + 18, y);
                    doc.setTextColor(198, 40, 40); doc.text(String(ds.high), margin + 80, y);
                    doc.setTextColor(230, 81, 0); doc.text(String(ds.medium), margin + 100, y);
                    doc.setTextColor(46, 125, 50); doc.text(String(ds.low), margin + 122, y);
                    doc.setTextColor(40, 40, 40); doc.setFont(undefined, 'bold');
                    doc.text(String(ds.totalScore), margin + 145, y);
                    doc.setFont(undefined, 'normal');
                    y += 5.5;
                }
                y += 8;
            }

            // Flags
            const byType = {};
            results.flags.forEach(f => { if (!byType[f.code]) byType[f.code] = []; byType[f.code].push(f); });
            const sevColors = { HIGH: [211, 47, 47], MEDIUM: [230, 81, 0], LOW: [245, 127, 23] };

            for (let [code, flist] of Object.entries(byType)) {
                const rule = RULES.find(r => r.code === code);
                const title = rule ? `${rule.id}: ${rule.title}` : code;
                checkSpace(12);
                doc.setFillColor(255, 235, 230); doc.setDrawColor(211, 47, 47);
                doc.roundedRect(margin, y, cw, 8, 1.5, 1.5, 'FD');
                doc.setFontSize(10); doc.setTextColor(160, 20, 20); doc.setFont(undefined, 'bold');
                doc.text(`${title} (${flist.length})`, margin + 3, y + 5.5);
                y += 11;

                for (let [idx, flag] of flist.entries()) {
                    const color = sevColors[flag.riskCategory] || [100, 100, 100];
                    const workH = doc.splitTextToSize(flag.work, cw - 24).length * 4 + doc.splitTextToSize(flag.remark, cw - 24).length * 3.8 + doc.splitTextToSize(flag.evidence, cw - 24).length * 3.8 + 14;
                    checkSpace(workH + 3);
                    doc.setFillColor(252, 252, 252); doc.setDrawColor(220, 220, 220);
                    doc.roundedRect(margin + 1, y, cw - 2, workH, 1.5, 1.5, 'FD');
                    doc.setFillColor(...color); doc.rect(margin + 1, y, 2.5, workH, 'F');
                    doc.setFillColor(...color); doc.circle(margin + 9, y + 4.5, 3, 'F');
                    doc.setFontSize(7); doc.setTextColor(255, 255, 255); doc.setFont(undefined, 'bold');
                    doc.text(String(idx + 1), margin + 9, y + 6, { align: 'center' });
                    doc.setFontSize(7); doc.setTextColor(...color); doc.setFont(undefined, 'bold');
                    doc.text(flag.riskCategory, margin + cw - 4, y + 5, { align: 'right' });

                    let cy = y + 4;
                    const tx = margin + 15;
                    const tw = cw - 18;
                    doc.setFontSize(9); doc.setFont(undefined, 'bold'); doc.setTextColor(30, 30, 30);
                    for (let line of doc.splitTextToSize(flag.work, tw - 12)) { doc.text(line, tx, cy); cy += 3.8; }
                    cy += 1;
                    doc.setFontSize(8); doc.setFont(undefined, 'normal'); doc.setTextColor(80, 80, 80);
                    for (let line of doc.splitTextToSize(`Details: ${flag.details}`, tw)) { doc.text(line, tx, cy); cy += 3.6; }
                    doc.setTextColor(...color);
                    for (let line of doc.splitTextToSize(`Issue: ${flag.remark}`, tw)) { doc.text(line, tx, cy); cy += 3.6; }
                    doc.setTextColor(60, 60, 60);
                    for (let line of doc.splitTextToSize(`Evidence: ${flag.evidence}`, tw)) { doc.text(line, tx, cy); cy += 3.6; }
                    y += workH + 2;
                }
                y += 3;
            }

            const totalPages = doc.internal.getNumberOfPages();
            for (let i = 1; i <= totalPages; i++) {
                doc.setPage(i);
                doc.setFillColor(245, 245, 245); doc.rect(0, pageH - 10, pageW, 10, 'F');
                doc.setFontSize(7); doc.setTextColor(120, 120, 120); doc.setFont(undefined, 'normal');
                doc.text('CAG of India — PWD Red Flag Detection System | Confidential', margin, pageH - 4);
                doc.text(`Page ${i} of ${totalPages}`, pageW - margin, pageH - 4, { align: 'right' });
            }
            doc.save(`RedFlag_Report_${new Date().toISOString().split('T')[0]}.pdf`);
        }

        // ==================== UI COMPONENTS ====================
        function LoginPage({ onLogin }) {

        function DivisionRiskTable({ flags }) {
            const divScores = useMemo(() => calculateDivisionRiskScores(flags), [flags]);
            const maxScore = Math.max(...divScores.map(d => d.totalScore), 1);

            return (
                <div className="risk-score-section">
                    <div className="risk-score-title">Division-wise Risk Ranking (Weighted Scoring)</div>
                    <div className="report-subtitle">
                        <strong>Scoring Weights:</strong> HIGH Risk = 50 points &nbsp;|&nbsp; MEDIUM Risk = 30 points &nbsp;|&nbsp; LOW Risk = 20 points
                    </div>
                    <div className="report-subtitle">
                        Divisions ranked in <strong>decreasing order of risk factor</strong> based on weighted average
                    </div>
                    <table className="division-rank-table">
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Division</th>
                                <th>HIGH (50)</th>
                                <th>MEDIUM (30)</th>
                                <th>LOW (20)</th>
                                <th>Total Score</th>
                                <th>Risk Level</th>
                                <th>Score Bar</th>
                            </tr>
                        </thead>
                        <tbody>
                            {divScores.map((ds, idx) => {
                                const pct = (ds.totalScore / maxScore) * 100;
                                const riskLevel = ds.totalScore >= 200 ? 'HIGH' : ds.totalScore >= 100 ? 'MEDIUM' : 'LOW';
                                const barClass = riskLevel === 'HIGH' ? 'high' : riskLevel === 'MEDIUM' ? 'medium' : 'low';
                                return (
                                    <tr key={ds.division}>
                                        <td><strong>#{idx + 1}</strong></td>
                                        <td>{ds.division}</td>
                                        <td style={{color:'#c62828',fontWeight:700}}>{ds.high}</td>
                                        <td style={{color:'#e65100',fontWeight:700}}>{ds.medium}</td>
                                        <td style={{color:'#2e7d32',fontWeight:700}}>{ds.low}</td>
                                        <td><strong>{ds.totalScore}</strong></td>
                                        <td><span className={`severity-badge ${riskLevel.toLowerCase()}`}>{riskLevel}</span></td>
                                        <td style={{width:'200px'}}>
                                            <div className="risk-bar-container">
                                                <div className={`risk-bar ${barClass}`} style={{width:`${pct}%`}}></div>
                                            </div>
                                        </td>
                                    </tr>
                                );
                            })}
                        </tbody>
                    </table>
                </div>
            );
        }

                const nf = { ...files };

                    if (['pdf','xlsx','xls','docx'].includes(ext)) nf[f.name] = f;
                    else setError(`Unsupported: ${f.name}. Only PDF, Excel, DOCX allowed.`);
                }
                setFiles(nf);

            const handleDrop = (e) => { e.preventDefault(); setDragging(false); handleFileSelect(e.dataTransfer.files); };

                const q = search.toLowerCase();
                return results.flags.filter(f => {
                    const matchesSearch = !q || [f.work, f.details, f.remark, f.evidence, f.code, f.ruleId].some(s => String(s).toLowerCase().includes(q));

                });

                                {results.flags.length > 0 && <DivisionRiskTable flags={results.flags} />}

                                <div className="tabs">
                                    <button className={`tab ${activeTab === 'flags' ? 'active' : ''}`} onClick={() => setActiveTab('flags')}>Red Flag Findings ({filteredFlags.length})</button>
                                    <button className={`tab ${activeTab === 'report' ? 'active' : ''}`} onClick={() => setActiveTab('report')}>Audit Report</button>
                                </div>

                                {activeTab === 'flags' && (
                                    <>
                                        <div className="search-filter-section">
                                            <input type="text" className="search-bar" placeholder="Search by work name, rule code, issue, evidence..." value={search} onChange={e => setSearch(e.target.value)} />
                                            <div className="filters-grid">
                                                <select className="filter-select" value={sevFilter} onChange={e => setSevFilter(e.target.value)}>
                                                    <option value="">All Risk Categories</option>
                                                    <option value="HIGH">HIGH Risk (Weight: 50)</option>
                                                    <option value="MEDIUM">MEDIUM Risk (Weight: 30)</option>
                                                    <option value="LOW">LOW Risk (Weight: 20)</option>
                                                </select>
                                            </div>
                                        </div>

                                        {filteredFlags.length === 0 ? (
                                            <div className="no-flags">
                                                <div className="no-flags-icon">✓</div>
                                                <div>{results.flags.length === 0 ? 'No red flags detected in the analyzed documents.' : 'No red flags match the current filters.'}</div>
                                            </div>
                                        ) : (
                                            <>
                                                {Object.entries(flagsByType).map(([code, flist]) => {
                                                    const rule = RULES.find(r => r.code === code);
                                                    const title = rule ? `${rule.id}: ${rule.title}` : code;
                                                    return (
                                                        <div key={code} className="flag-section">
                                                            <div className="flag-header">
                                                                <span>{title}</span>
                                                                <span className="severity-badge" style={{background:'rgba(255,255,255,0.2)',color:'#fff'}}>{flist.length}</span>
                                                            </div>
                                                            <div className="flag-content">
                                                                {flist.map((flag, idx) => (
                                                                    <div key={idx} className={`flag-item severity-${flag.riskCategory.toLowerCase()}`}>
                                                                        <div className="flag-title">
                                                                            {flag.work}
                                                                            <span className={`severity-badge ${flag.riskCategory.toLowerCase()}`}>{flag.riskCategory} (Weight: {RISK_WEIGHTS[flag.riskCategory]})</span>
                                                                        </div>
                                                                        <div className="flag-detail"><strong>Details:</strong> {flag.details}</div>
                                                                        <div className="flag-detail"><strong>Issue:</strong> {flag.remark}</div>
                                                                        <div className="flag-detail"><strong>Evidence:</strong> {flag.evidence}</div>
                                                                        {flag.division && <div className="flag-detail"><strong>Division:</strong> {flag.division}</div>}
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </>
                                        )}
                                    </>
                                )}

                                {activeTab === 'report' && (
                                    <div className="report-section">
                                        <div className="report-title">Consolidated Audit Report</div>
                                        <div className="report-subtitle">
                                            This report consolidates all detected red flags risk-wise and groups them division-wise with weighted risk scores.
                                        </div>
                                        <DivisionRiskTable flags={results.flags} />
                                        <div style={{marginTop:'20px',background:'#fff',borderRadius:'8px',padding:'20px'}}>
                                            <h3 style={{marginBottom:'12px',fontSize:'16px'}}>Risk-wise Flag Distribution</h3>
                                            <table className="division-rank-table">
                                                <thead>
                                                    <tr><th>Risk Category</th><th>Weight</th><th>Count</th><th>Total Weighted Score</th><th>% of Total</th></tr>
                                                </thead>
                                                <tbody>
                                                    <tr>
                                                        <td><span className="severity-badge critical">HIGH</span></td>
                                                        <td>50</td>
                                                        <td>{sevCounts.high}</td>
                                                        <td><strong>{sevCounts.high * 50}</strong></td>
                                                        <td>{results.flags.length > 0 ? ((sevCounts.high * 50) / (sevCounts.high * 50 + sevCounts.medium * 30 + sevCounts.low * 20) * 100).toFixed(1) : 0}%</td>
                                                    </tr>
                                                    <tr>
                                                        <td><span className="severity-badge high">MEDIUM</span></td>
                                                        <td>30</td>
                                                        <td>{sevCounts.medium}</td>
                                                        <td><strong>{sevCounts.medium * 30}</strong></td>
                                                        <td>{results.flags.length > 0 ? ((sevCounts.medium * 30) / (sevCounts.high * 50 + sevCounts.medium * 30 + sevCounts.low * 20) * 100).toFixed(1) : 0}%</td>
                                                    </tr>
                                                    <tr>
                                                        <td><span className="severity-badge low">LOW</span></td>
                                                        <td>20</td>
                                                        <td>{sevCounts.low}</td>
                                                        <td><strong>{sevCounts.low * 20}</strong></td>
                                                        <td>{results.flags.length > 0 ? ((sevCounts.low * 20) / (sevCounts.high * 50 + sevCounts.medium * 30 + sevCounts.low * 20) * 100).toFixed(1) : 0}%</td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}

                                <button className="download-btn" onClick={() => generatePDF(results)}>Download PDF Report</button>
                                <button className="analyze-btn" onClick={() => { setResults(null); setFiles({}); setSearch(''); setSevFilter(''); setActiveTab('flags'); }} style={{marginTop: 12}}>Analyze New Documents</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
