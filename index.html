<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Works Audit Red Flag Detection System</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>
    <div id="root"></div>

    <div id="error-fallback" class="hidden fixed inset-0 bg-red-900 text-white p-8 overflow-auto font-mono z-50">
        <h1 class="text-2xl font-bold border-b border-red-700 pb-2 mb-4">🚨 Critical Production Runtime Crash Identified</h1>
        <p class="mb-4 text-red-200">The application failed to execute. Review the runtime diagnostics log below:</p>
        <pre id="error-log" class="bg-black/40 p-4 rounded-lg text-sm whitespace-pre-wrap"></pre>
    </div>

    <script>
        window.addEventListener('error', function(e) {
            document.getElementById('error-fallback').classList.remove('hidden');
            document.getElementById('error-log').textContent += '\n[' + new Date().toISOString() + '] ' + e.message + ' at ' + e.filename + ':' + e.lineno;
        });
    </script>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const BASELINE_SYSTEM_DATE = new Date("2026-06-02");

        // Canonical Master Rule Directory
        const MASTER_RULES_REF = {
            R01: { code: "DIVERSION_OF_FUND", title: "Diversion of fund across deposit works", severity: "CRITICAL", source: "BEAMS / AMS Cashbook" },
            R02: { code: "WASTEFUL_SURVEY", title: "Wasteful expenditure on Survey works", severity: "HIGH", source: "BEAMS Capital Works" },
            R03: { code: "EXCESS_WITHOUT_APPROVAL", title: "Excess expenditure without Govt approval", severity: "CRITICAL", source: "BEAMS UC" },
            R04: { code: "OVERLAPPING_MAINTENANCE", title: "Overlapping works / avoidable DLP maintenance", severity: "HIGH", source: "BEAMS + Agreement" },
            R05: { code: "DELAY_COMPLETION", title: "Delay in completion of work", severity: "MEDIUM", source: "BEAMS Capital Works" },
            R06: { code: "SPLITTING_OF_WORK", title: "Splitting of work to avoid tender process", severity: "CRITICAL", source: "Agreement Register" },
            R07: { code: "NO_CENTAGE_RECOVERY", title: "Non-recovery of centage charges", severity: "HIGH", source: "BEAMS Deposit UC" },
            R08: { code: "UNSPENT_BALANCE", title: "Unspent balance not returned to user dept", severity: "HIGH", source: "BEAMS Deposit UC" },
            R09: { code: "EXCESS_25_PERCENT", title: "Excess expenditure >25% of contract cost", severity: "CRITICAL", source: "BEAMS UC" },
            R10: { code: "ABANDONED_WORK", title: "Abandoned work (no progress >3 years)", severity: "CRITICAL", source: "BEAMS UC" },
            R11: { code: "INFLATED_SSR", title: "Inflated SSR/DSR (excessive below-10% tenders)", severity: "HIGH", source: "Agreement Register" },
            R12: { code: "PARKING_OF_FUND", title: "Parking of fund (fag-end transfer)", severity: "CRITICAL", source: "BEAMS Capital UC" },
            R13: { code: "NO_DELAY_PENALTY", title: "Non-imposition of penalties for delayed work", severity: "HIGH", source: "BEAMS" },
            R14: { code: "INSURANCE_LAPSE", title: "Non-renewal of Insurance Policy / Bank Guarantee", severity: "HIGH", source: "BEAMS" },
            R15: { code: "SPLIT_HIGHER_SANCTION", title: "Splitting to avoid higher-authority sanction", severity: "CRITICAL", source: "BEAMS Capital Works" },
            R16: { code: "HAND_RECEIPT_PAYMENT", title: "Irregular payment on Hand Receipt", severity: "CRITICAL", source: "AMS Cash Book Form 10" },
            R17: { code: "NO_CLASSIFICATION", title: "Irregular payment without proper classification", severity: "HIGH", source: "AMS Cash Book Form 10" },
            R18: { code: "TS_BEFORE_AA", title: "Technical Sanction prior to Administrative Approval", severity: "HIGH", source: "BEAMS UC" },
            R19: { code: "BLOCKING_OF_FUNDS", title: "Blocking of funds (deposit work, no expenditure)", severity: "CRITICAL", source: "BEAMS Deposit UC" },
            R20: { code: "SHORT_RECEIPT_DEPOSIT", title: "Short receipt of funds from user department", severity: "HIGH", source: "BEAMS Deposit UC" }
        };

        const COLUMN_ALIASES_MAP = {
            work_id: ['work id', 'id', 'work_id', 'deposit work id', 'work_no'],
            work_name: ['name of work', 'work name', 'work_name', 'audit criteria', 'description of work'],
            division: ['division', 'division name', 'executive engineer division', 'office'],
            major_head: ['major head', 'major_head', 'mh', 'account head'],
            remark: ['remark', 'remarks', 'parameters required for red flag', 'comments'],
            contractor: ['contractor', 'contractor name', 'name of agency', 'agency'],
            road_code: ['road code', 'road_code', 'road description', 'mrd code'],
            km_start: ['km start', 'km_start', 'start km', 'chainage from'],
            km_end: ['km end', 'km_end', 'end km', 'chainage to'],
            aa_amount: ['aa amount', 'administrative approval', 'aa', 'approved cost', 'aa value'],
            contract_cost: ['contract cost', 'contract_cost', 'agreement cost', 'agreement value', 'accepted tender amount'],
            tech_sanction_cost: ['ts cost', 'technical sanction cost', 'ts amount', 'sanction cost'],
            cumulative_expenditure: ['cumulative expenditure', 'up to date expenditure', 'total expenditure', 'expenditure', 'cum_exp'],
            bill_amount: ['bill amount', 'bill_amount', 'ra bill amount', 'current bill amount'],
            percentage_amount: ['percentage amount', 'centage amount', 'centage', 'centage_amount'],
            balance_amount: ['balance amount with ddo', 'unspent balance', 'balance', 'balance_amount'],
            cumulative_receipt_amount: ['cumulative receipt amount', 'total receipt', 'amount received', 'receipt amount', 'cumulative receipt', 'total receipts'],
            tender_premium_pct: ['tender premium pct', 'tender premium', 'premium', 'below above percentage', 'tender_premium'],
            ts_date: ['ts date', 'technical sanction date', 'date of ts', 'ts accorded on', 'date of technical sanction'],
            aa_date: ['aa date', 'administrative approval date', 'date of aa', 'aa accorded on', 'date of administrative approval'],
            receipt_date: ['receipt date', 'date of receipt', 'fund received date', 'deposit received date'],
            stipulated_completion_date: ['stipulated completion date', 'completion date', 'stipulated_completion_date', 'date of completion'],
            last_ra_bill_date: ['last ra bill date', 'last_ra_bill_date', 'ra bill payment date', 'bill date', 'ra_bill_date']
        };

        const parseAuditDate = (rawVal) => {
            if (!rawVal) return null;
            if (rawVal instanceof Date) return isNaN(rawVal.getTime()) ? null : rawVal;
            if (!isNaN(rawVal) && Number(rawVal) > 30000 && Number(rawVal) < 60000) {
                return new Date((Number(rawVal) - 25569) * 86400 * 1000);
            }
            let cleanStr = String(rawVal).trim();
            let parts = cleanStr.split(/[-/]/);
            if (parts.length === 3) {
                if (parts[0].length === 4) {
                    return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                }
                return new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]));
            }
            let timestamp = Date.parse(cleanStr);
            return isNaN(timestamp) ? null : new Date(timestamp);
        };

        const ENTERPRISE_DEMO_ROWS = [
            { "Deposit Work ID": "DEP-001", "Name of Work": "Construction of Sabhagruh at Darewadi", "Division": "PWD Nagpur-2", "AA Amount": 10000000, "Cumulative Receipt Amount": 5000000, "Fund Received Date": "15/03/2022", "RA Bill Amount": 2500000, "Centage Amount": 0, "Total Expenditure": 0, "Balance Amount with DDO": 5000000, "Parameters Required for Red Flag": "Electrical transfer drawing", "Major Head": "5054" },
            { "Work ID": "DEP-002", "Name of Work": "Water Supply Scheme Arvi", "Division": "PWD Arvi", "AA Amount": 6000000, "Total Receipts": 6000000, "Date of Receipt": "10/01/2024", "Bill Amount": 4000000, "Centage": 20000, "Cumulative Expenditure": 3800000, "Unspent Balance": 2200000, "Remarks": "Work Completed", "Major Head": "4701" },
            { "Work ID": "CAP-101", "Name of Work": "Improvement to Tidgangi Dahera Rd", "Division": "PWD Nagpur-2", "Administrative Approval": 7000000, "Administrative Approval Date": "15/03/2024", "Technical Sanction Date": "22/02/2024", "Technical Sanction Cost": 7500000, "Contract Cost": 7500000, "Total Expenditure": 10300000, "Bill Amount": 2800000, "RA Bill Payment Date": "27/03/2025", "Stipulated Completion Date": "10/12/2024", "Remarks": "survey remark with nil RA bill", "Major Head": "5054" },
            { "Work ID": "CAP-102", "Name of Work": "Cement Concrete Road Hudkeshwar", "Division": "PWD Nagpur-2", "AA Amount": 15000000, "AA Date": "01/01/2022", "TS Date": "10/01/2022", "TS Cost": 14000000, "Contract Cost": 14000000, "Cumulative Expenditure": 5000000, "Bill Amount": 1000000, "RA Bill Payment Date": "12/02/2023", "Stipulated Completion Date": "15/10/2022", "Remarks": "Incomplete delayed site assignment", "Major Head": "5054" },
            { "Work ID": "CAP-103", "Name of Work": "Fag end allocation project", "Division": "PWD Nilanga", "AA Amount": 20000000, "AA Date": "01/04/2024", "TS Date": "05/04/2024", "TS Cost": 19000000, "Agreement Value": 19000000, "Total Expenditure": 18000000, "Bill Amount": 6000000, "RA Bill Payment Date": "28/03/2025", "Stipulated Completion Date": "31/12/2025", "Remarks": "transfer to electrical division at the fag end", "Major Head": "5054" },
            { "Work ID": "SPL-001", "Name of Work": "Bridges Construction Segment A", "Road Code": "MDR-43", "Chainage From": 12, "Chainage To": 14, "Division": "PWD Nilanga", "Contract Cost": 8500000, "AA Date": "10/05/2024", "TS Cost": 12000000, "Tender Premium": -15, "Contractor": "Sharda Construction", "Major Head": "5054" },
            { "Work ID": "SPL-002", "Name of Work": "Bridges Construction Segment B", "Road Code": "MDR-43", "Chainage From": 13, "Chainage To": 15, "Division": "PWD Nilanga", "Contract Cost": 9000000, "AA Date": "12/05/2024", "TS Cost": 11000000, "Tender Premium": -12, "Contractor": "Sharda Construction", "Major Head": "5054" },
            { "Work ID": "SPL-003", "Name of Work": "Bridges Construction Segment C", "Road Code": "MDR-43", "Chainage From": 18, "Chainage To": 20, "Division": "PWD Nilanga", "Contract Cost": 7000000, "AA Date": "14/05/2024", "TS Cost": 15000000, "Tender Premium": -14, "Contractor": "Sharda Construction", "Major Head": "5054" },
            { "Work ID": "CSH-901", "Name of Work": "HAM Road Settlement drawing", "Division": "PWD Nagbhid", "Bill Amount": 23700000, "Remarks": "paid vide HR voucher 439", "Major Head": "" },
            { "Work ID": "CSH-902", "Name of Work": "Asset Drawing Routine", "Division": "PWD Arvi", "Bill Amount": 85097000, "Remarks": "Voucher No 95 Sharda Corp payment", "Major Head": "" }
        ];

        function App() {
            const [auditData, setAuditData] = useState(ENTERPRISE_DEMO_ROWS);
            const [searchQuery, setSearchQuery] = useState("");
            const [selectedDivision, setSelectedDivision] = useState("ALL");

            const extractCanonicalRow = (rawRow, index) => {
                let canonical = {};
                const rawKeys = Object.keys(rawRow);

                Object.keys(COLUMN_ALIASES_MAP).forEach(canonicalTarget => {
                    const acceptableAliases = COLUMN_ALIASES_MAP[canonicalTarget];
                    let foundValue = undefined;

                    for (let rawKey of rawKeys) {
                        const normalizedRawKey = rawKey.toLowerCase().trim().replace(/[^a-z0-9]/g, '');
                        for (let alias of acceptableAliases) {
                            const normalizedAlias = alias.toLowerCase().trim().replace(/[^a-z0-9]/g, '');
                            if (normalizedRawKey === normalizedAlias) {
                                foundValue = rawRow[rawKey];
                                break;
                            }
                        }
                        if (foundValue !== undefined) break;
                    }
                    canonical[canonicalTarget] = foundValue;
                });

                return {
                    work_id: canonical.work_id || `ROW-REF-${index}`,
                    work_name: String(canonical.work_name || 'Unidentified Reference Work'),
                    division: String(canonical.division || 'Unknown Division'),
                    major_head: String(canonical.major_head || '').trim(),
                    remark: String(canonical.remark || ''),
                    contractor: String(canonical.contractor || ''),
                    road_code: String(canonical.road_code || ''),
                    km_start: parseFloat(canonical.km_start) || 0,
                    km_end: parseFloat(canonical.km_end) || 0,
                    aa_amount: parseFloat(canonical.aa_amount) || 0,
                    contract_cost: parseFloat(canonical.contract_cost) || 0,
                    tech_sanction_cost: parseFloat(canonical.tech_sanction_cost) || 0,
                    cumulative_expenditure: parseFloat(canonical.cumulative_expenditure) || 0,
                    bill_amount: parseFloat(canonical.bill_amount) || 0,
                    percentage_amount: parseFloat(canonical.percentage_amount) || 0,
                    balance_amount: parseFloat(canonical.balance_amount) || 0,
                    cumulative_receipt_amount: parseFloat(canonical.cumulative_receipt_amount) || 0,
                    tender_premium_pct: parseFloat(canonical.tender_premium_pct) || 0,
                    is_deposit_work: !!canonical.cumulative_receipt_amount || String(canonical.work_id).includes('DEP'),
                    ts_date: parseAuditDate(canonical.ts_date),
                    aa_date: parseAuditDate(canonical.aa_date),
                    receipt_date: parseAuditDate(canonical.receipt_date),
                    stipulated_completion_date: parseAuditDate(canonical.stipulated_completion_date),
                    last_ra_bill_date: parseAuditDate(canonical.last_ra_bill_date)
                };
            };

            const processedReport = useMemo(() => {
                let itemizedIssues = [];
                let normalizedRows = auditData.map((r, i) => extractCanonicalRow(r, i));

                let roadMap = {};
                let contractorCluster = {};
                let divisionTenderStats = {};

                normalizedRows.forEach(row => {
                    let flags = [];
                    const rem = row.remark.toLowerCase();
                    const wName = row.work_name.toLowerCase();

                    if (row.road_code) {
                        if (!roadMap[row.road_code]) roadMap[row.road_code] = [];
                        roadMap[row.road_code].push(row);
                    }
                    if (row.contractor && row.road_code && row.aa_date) {
                        const yrKey = row.aa_date.getFullYear();
                        const cKey = `${row.contractor}#${row.road_code}#${yrKey}`;
                        if (!contractorCluster[cKey]) contractorCluster[cKey] = [];
                        contractorCluster[cKey].push(row);
                    }
                    if (row.division) {
                        if (!divisionTenderStats[row.division]) {
                            divisionTenderStats[row.division] = { totalCount: 0, lowBidCount: 0, totalValue: 0, lowBidValue: 0 };
                        }
                        divisionTenderStats[row.division].totalCount++;
                        divisionTenderStats[row.division].totalValue += row.contract_cost;
                        if (row.tender_premium_pct < -10) {
                            divisionTenderStats[row.division].lowBidCount++;
                            divisionTenderStats[row.division].lowBidValue += row.contract_cost;
                        }
                    }

                    if (row.is_deposit_work && rem && !wName.includes(rem) && !rem.includes(wName)) {
                        flags.push({ ...MASTER_RULES_REF.R01, id: 'R01', details: `Remark description "${row.remark}" diverges from official title: "${row.work_name}".` });
                    }
                    if (rem.includes('survey') && row.bill_amount === 0 && row.cumulative_expenditure > 0) {
                        flags.push({ ...MASTER_RULES_REF.R02, id: 'R02', details: `Survey operations logged active ledger expense but accompanied by a nil/zero updated RA bill value.` });
                    }
                    if (row.aa_amount > 0 && row.cumulative_expenditure > (1.10 * row.aa_amount)) {
                        flags.push({ ...MASTER_RULES_REF.R03, id: 'R03', details: `Cumulative financial output (₹${row.cumulative_expenditure.toLocaleString()}) exceeds the 110% ceiling limit of approved AA amount (₹${row.aa_amount.toLocaleString()}).` });
                    }
                    if (row.stipulated_completion_date && row.stipulated_completion_date < BASELINE_SYSTEM_DATE && !rem.includes('completed')) {
                        flags.push({ ...MASTER_RULES_REF.R05, id: 'R05', details: `Project timeframe expired past stipulated completion limit (${row.stipulated_completion_date.toLocaleDateString()}) while work remains uncompleted.` });
                    }
                    if (row.is_deposit_work && row.percentage_amount === 0 && row.bill_amount > 0) {
                        flags.push({ ...MASTER_RULES_REF.R07, id: 'R07', details: `Active draw of bill assets (₹${row.bill_amount.toLocaleString()}) processed with zero centage recoveries.` });
                    }
                    if (row.is_deposit_work && row.balance_amount > 100000 && rem.includes('completed')) {
                        flags.push({ ...MASTER_RULES_REF.R08, id: 'R08', details: `Work completed but unspent balance of ₹${row.balance_amount.toLocaleString()} remains stagnant (violates ₹1 Lakh threshold).` });
                    }
                    if (row.contract_cost > 0 && row.cumulative_expenditure > (1.25 * row.contract_cost)) {
                        flags.push({ ...MASTER_RULES_REF.R09, id: 'R09', details: `Aggregate running book value metrics (₹${row.cumulative_expenditure.toLocaleString()}) show overrun exceeding 125% of contract value (₹${row.contract_cost.toLocaleString()}).` });
                    }
                    if (row.contract_cost > 0 && row.cumulative_expenditure < (0.75 * row.contract_cost) && row.last_ra_bill_date) {
                        let yearsStagnant = (BASELINE_SYSTEM_DATE - row.last_ra_bill_date) / (1000 * 60 * 60 * 24 * 365.25);
                        if (yearsStagnant > 3) {
                            flags.push({ ...MASTER_RULES_REF.R10, id: 'R10', details: `Project structure at risk of abandonment; overall progress is below 75% baseline and zero transactional accounting updates have occurred for ${yearsStagnant.toFixed(1)} consecutive years.` });
                        }
                    }
                    if (row.last_ra_bill_date && row.last_ra_bill_date.getMonth() === 2 && row.bill_amount > 5000000 && (rem.includes('transfer') || rem.includes('electrical') || rem.includes('fag end'))) {
                        flags.push({ ...MASTER_RULES_REF.R12, id: 'R12', details: `High-value financial transfer allocation (₹${row.bill_amount.toLocaleString()}) processed at the tail-end of the financial calendar (March) to another division.` });
                    }
                    if (row.stipulated_completion_date && row.last_ra_bill_date && row.last_ra_bill_date > row.stipulated_completion_date) {
                        flags.push({ ...MASTER_RULES_REF.R13, id: 'R13', details: `Bill date (${row.last_ra_bill_date.toLocaleDateString()}) is past the stipulated completion date (${row.stipulated_completion_date.toLocaleDateString()}) without verified extension/penalty data.` });
                        flags.push({ ...MASTER_RULES_REF.R14, id: 'R14', details: `Extended active execution running clear of original schedule limits with no verified renewal files for risk policies.` });
                    }
                    if (row.bill_amount > 1000000 && (rem.includes('paid vide hr') || rem.includes('hand receipt') || rem.includes('hr '))) {
                        flags.push({ ...MASTER_RULES_REF.R16, id: 'R16', details: `Substantial drawing of ₹${row.bill_amount.toLocaleString()} processed on a Hand Receipt instead of an authorized standardized voucher/bill matrix.` });
                    }
                    if (row.bill_amount > 1000000 && !row.major_head) {
                        flags.push({ ...MASTER_RULES_REF.R17, id: 'R17', details: `High-value transaction drawing (₹${row.bill_amount.toLocaleString()}) posted inside cash register books without any active entry of a Major Head code.` });
                    }
                    if (row.ts_date && row.aa_date && row.ts_date < row.aa_date) {
                        flags.push({ ...MASTER_RULES_REF.R18, id: 'R18', details: `Workflow structural integrity error: Technical Sanction verification date (${row.ts_date.toLocaleDateString()}) predates formal Administrative Approval allocation (${row.aa_date.toLocaleDateString()}).` });
                    }
                    if (row.is_deposit_work && row.cumulative_expenditure === 0 && row.balance_amount > 0 && row.receipt_date) {
                        let fundAge = (BASELINE_SYSTEM_DATE - row.receipt_date) / (1000 * 60 * 60 * 24 * 365.25);
                        if (fundAge > 1) {
                            flags.push({ ...MASTER_RULES_REF.R19, id: 'R19', details: `Resource blocking anomaly: Deposit funding profile received ${fundAge.toFixed(1)} years ago remains unspent with zero project operational outlays.` });
                        }
                    }
                    if (row.is_deposit_work && row.aa_amount > 0 && row.cumulative_receipt_amount < row.aa_amount) {
                        flags.push({ ...MASTER_RULES_REF.R20, id: 'R20', details: `Shortfall in prerequisite compliance deposit; aggregate receipts received (₹${row.cumulative_receipt_amount.toLocaleString()}) do not cover the full AA cost (₹${row.aa_amount.toLocaleString()}).` });
                    }

                    if (flags.length > 0) {
                        itemizedIssues.push({ ...row, identifiedFlags: flags });
                    }
                });

                Object.keys(roadMap).forEach(road => {
                    let items = roadMap[road];
                    for (let i = 0; i < items.length; i++) {
                        for (let j = i + 1; j < items.length; j++) {
                            let rA = items[i];
                            let rB = items[j];
                            let overlap = (rA.km_start < rB.km_end && rA.km_end > rB.km_start);
                            if (overlap) {
                                [rA, rB].forEach(target => {
                                    let match = itemizedIssues.find(x => x.work_id === target.work_id);
                                    if (!match) { match = { ...target, identifiedFlags: [] }; itemizedIssues.push(match); }
                                    if (!match.identifiedFlags.some(f => f.id === 'R04')) {
                                        match.identifiedFlags.push({ ...MASTER_RULES_REF.R04, id: 'R04', details: `Spatial geometric conflict: Chainage metrics overlapping along road track code [${road}] with parallel project segments.` });
                                    }
                                });
                            }
                        }
                    }
                });

                Object.keys(contractorCluster).forEach(key => {
                    let cluster = contractorCluster[key];
                    if (cluster.length > 1) {
                        let subTenLakhItems = cluster.filter(x => x.contract_cost < 1000000);
                        if (subTenLakhItems.length > 1) {
                            subTenLakhItems.forEach(item => {
                                let match = itemizedIssues.find(x => x.work_id === item.work_id);
                                if (!match) { match = { ...item, identifiedFlags: [] }; itemizedIssues.push(match); }
                                if (!match.identifiedFlags.some(f => f.id === 'R06')) {
                                    match.identifiedFlags.push({ ...MASTER_RULES_REF.R06, id: 'R06', details: `Artificial chunking risk: Multiple sub-₹10 Lakh execution agreements signed with contractor "${item.contractor}" across matching track assets during identical annual planning loop.` });
                                }
                            });
                        }
                    }
                });

                Object.keys(roadMap).forEach(road => {
                    let items = roadMap[road];
                    for (let i = 0; i < items.length; i++) {
                        for (let j = i + 1; j < items.length; j++) {
                            let rA = items[i];
                            let rB = items[j];
                            let adjacent = (rA.km_end === rB.km_start || rB.km_end === rA.km_start);
                            if (adjacent && rA.tech_sanction_cost > 10000000 && rB.tech_sanction_cost > 10000000) {
                                [rA, rB].forEach(rItem => {
                                    let match = itemizedIssues.find(x => x.work_id === rItem.work_id);
                                    if (!match) { match = { ...rItem, identifiedFlags: [] }; itemizedIssues.push(match); }
                                    if (!match.identifiedFlags.some(f => f.id === 'R15')) {
                                        match.identifiedFlags.push({ ...MASTER_RULES_REF.R15, id: 'R15', details: `Sanction threshold manipulation risk: Adjacency detected across technical segments exceeding the ₹1 Crore local threshold boundary on matching road corridors.` });
                                    }
                                });
                            }
                        }
                    }
                });

                Object.keys(divisionTenderStats).forEach(div => {
                    let stats = divisionTenderStats[div];
                    let countRatio = stats.totalCount > 0 ? (stats.lowBidCount / stats.totalCount) : 0;
                    let valueRatio = stats.totalValue > 0 ? (stats.lowBidValue / stats.totalValue) : 0;

                    if (countRatio > 0.20 || valueRatio > 0.20) {
                        normalizedRows.forEach(row => {
                            if (row.division === div && row.tender_premium_pct < -10) {
                                let match = itemizedIssues.find(x => x.work_id === row.work_id);
                                if (!match) { match = { ...row, identifiedFlags: [] }; itemizedIssues.push(match); }
                                if (!match.identifiedFlags.some(f => f.id === 'R11')) {
                                    match.identifiedFlags.push({ ...MASTER_RULES_REF.R11, id: 'R11', details: `Systemic Rate Inflation Marker: Division profile presents over 20% of agreements accepted at deeply depressed pricing structures (below -10% limits).` });
                                }
                            }
                        });
                    }
                });

                return itemizedIssues;
            }, [auditData]);

            const compiledDivisionsReport = useMemo(() => {
                let reportMap = {};
                
                auditData.forEach(r => {
                    let divName = r.Division || r.division || "Unknown Division";
                    if (!reportMap[divName]) {
                        reportMap[divName] = { name: divName, critical: 0, high: 0, medium: 0, totalFlags: 0, score: 0, affectedWorks: new Set() };
                    }
                });

                processedReport.forEach(work => {
                    const div = work.division || "Unknown Division";
                    if (!reportMap[div]) {
                        reportMap[div] = { name: div, critical: 0, high: 0, medium: 0, totalFlags: 0, score: 0, affectedWorks: new Set() };
                    }
                    work.identifiedFlags.forEach(flag => {
                        reportMap[div].totalFlags++;
                        reportMap[div].affectedWorks.add(work.work_id);
                        if (flag.severity === "CRITICAL") { reportMap[div].critical++; reportMap[div].score += 50; }
                        else if (flag.severity === "HIGH") { reportMap[div].high++; reportMap[div].score += 30; }
                        else if (flag.severity === "MEDIUM") { reportMap[div].medium++; reportMap[div].score += 20; }
                    });
                });

                return Object.values(reportMap).sort((a, b) => b.score - a.score);
            }, [processedReport, auditData]);

            const summaryCounters = useMemo(() => {
                let counts = { critical: 0, high: 0, medium: 0, distinctWorks: processedReport.length };
                processedReport.forEach(w => {
                    w.identifiedFlags.forEach(f => {
                        if (f.severity === "CRITICAL") counts.critical++;
                        else if (f.severity === "HIGH") counts.high++;
                        else if (f.severity === "MEDIUM") counts.medium++;
                    });
                });
                return counts;
            }, [processedReport]);

            const filteredWorksView = useMemo(() => {
                return processedReport.filter(work => {
                    const matchesDiv = (selectedDivision === "ALL" || work.division === selectedDivision);
                    const text = `${work.work_id} ${work.work_name} ${work.division}`.toLowerCase();
                    const matchesSearch = text.includes(searchQuery.toLowerCase());
                    return matchesDiv && matchesSearch;
                });
            }, [processedReport, selectedDivision, searchQuery]);

            const handleExcelUpload = (e) => {
                const uploadedFile = e.target.files[0];
                if (!uploadedFile) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const binaryStr = evt.target.result;
                        const workbook = XLSX.read(binaryStr, { type: 'binary', cellDates: true });
                        const sheetName = workbook.SheetNames[0];
                        const rowsData = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName]);
                        if (rowsData.length > 0) setAuditData(rowsData);
                    } catch (err) {
                        alert("Failed parsing Excel structural configurations: " + err.message);
                    }
                };
                reader.readAsBinaryString(uploadedFile);
            };

            const triggerPdfReportExport = () => {
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                let yOffset = 20;

                pdf.setFont("Helvetica", "bold");
                pdf.setFontSize(14);
                pdf.text("OFFICE OF THE ACCOUNTANT GENERAL (AUDIT-II), NAGPUR", 15, yOffset);
                
                yOffset += 8;
                pdf.setFontSize(11);
                pdf.setFont("Helvetica", "normal");
                pdf.text("Works Audit Red Flag Executive Dashboard Summary Report", 15, yOffset);
                yOffset += 6;
                pdf.line(15, yOffset, 195, yOffset);
                yOffset += 10;

                pdf.setFont("Helvetica", "bold");
                pdf.text("Prioritized Division Vulnerability Rankings", 15, yOffset);
                yOffset += 8;

                pdf.setFontSize(9);
                pdf.text("Division Name", 15, yOffset);
                pdf.text("Critical", 90, yOffset);
                pdf.text("High", 115, yOffset);
                pdf.text("Medium", 140, yOffset);
                pdf.text("Risk Score", 165, yOffset);
                yOffset += 2;
                pdf.line(15, yOffset, 195, yOffset);
                yOffset += 5;

                pdf.setFont("Helvetica", "normal");
                compiledDivisionsReport.forEach(div => {
                    if (yOffset > 270) { pdf.addPage(); yOffset = 20; }
                    pdf.text(String(div.name), 15, yOffset);
                    pdf.text(String(div.critical), 90, yOffset);
                    pdf.text(String(div.high), 115, yOffset);
                    pdf.text(String(div.medium), 140, yOffset);
                    pdf.setFont("Helvetica", "bold");
                    pdf.text(String(div.score), 165, yOffset);
                    pdf.setFont("Helvetica", "normal");
                    yOffset += 6;
                });

                yOffset += 10;
                if (yOffset > 250) { pdf.addPage(); yOffset = 20; }
                pdf.setFont("Helvetica", "bold");
                pdf.text("Detailed Itemized Red Flag Disclosures", 15, yOffset);
                yOffset += 8;

                filteredWorksView.forEach(w => {
                    if (yOffset > 250) { pdf.addPage(); yOffset = 20; }
                    pdf.setFont("Helvetica", "bold");
                    pdf.setFontSize(9);
                    pdf.text(`Work ID: ${w.work_id} [${w.division}]`, 15, yOffset);
                    yOffset += 4;
                    pdf.setFont("Helvetica", "normal");
                    pdf.text(`Name: ${w.work_name.substring(0, 85)}`, 15, yOffset);
                    yOffset += 4;

                    w.identifiedFlags.forEach(f => {
                        if (yOffset > 260) { pdf.addPage(); yOffset = 20; }
                        pdf.setFont("Helvetica", "bold");
                        pdf.text(`  -> [${f.id}] ${f.title} (${f.severity})`, 15, yOffset);
                        yOffset += 4;
                        pdf.setFont("Helvetica", "italic");
                        let splitTxt = pdf.splitTextToSize(`Context: ${f.details}`, 170);
                        pdf.text(splitTxt, 18, yOffset);
                        yOffset += (splitTxt.length * 4) + 2;
                    });
                    yOffset += 2;
                });

                pdf.save(`Works_Audit_RedFlags_Report.pdf`);
            };

            return (
                <div className="min-h-screen flex flex-col">
                    <header className="bg-slate-900 text-white shadow border-b border-slate-800">
                        <div className="max-w-7xl mx-auto px-4 py-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                            <div>
                                <span className="text-xs font-semibold uppercase tracking-widest text-blue-400">SAI Enterprise Compliance Framework</span>
                                <h1 className="text-xl font-bold tracking-tight">Works Audit Red Flag Detection System</h1>
                            </div>
                            <div className="flex flex-wrap gap-3">
                                <label className="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-lg shadow transition flex items-center gap-2">
                                    <span>Upload Audit Excel Sheet</span>
                                    <input type="file" accept=".xlsx, .xls" onChange={handleExcelUpload} className="hidden" />
                                </label>
                                <button onClick={triggerPdfReportExport} className="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold px-4 py-2.5 rounded-lg shadow transition">
                                    Export Audit PDF
                                </button>
                            </div>
                        </div>
                    </header>

                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">
                        <section className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                            <div className="bg-white border border-rose-100 rounded-xl p-4 shadow-sm">
                                <span className="text-[11px] font-medium text-slate-500 uppercase tracking-wider">Critical Faults</span>
                                <div className="flex items-baseline gap-2 mt-1">
                                    <span className="text-2xl font-bold text-rose-600">{summaryCounters.critical}</span>
                                    <span className="text-[10px] text-rose-400 font-medium">Flags</span>
                                </div>
                            </div>
                            <div className="bg-white border border-amber-100 rounded-xl p-4 shadow-sm">
                                <span className="text-[11px] font-medium text-slate-500 uppercase tracking-wider">High Risk</span>
                                <div className="flex items-baseline gap-2 mt-1">
                                    <span className="text-2xl font-bold text-amber-500">{summaryCounters.high}</span>
                                    <span className="text-[10px] text-amber-500 font-medium">Flags</span>
                                </div>
                            </div>
                            <div className="bg-white border border-blue-100 rounded-xl p-4 shadow-sm">
                                <span className="text-[11px] font-medium text-slate-500 uppercase tracking-wider">Medium Risk</span>
                                <div className="flex items-baseline gap-2 mt-1">
                                    <span className="text-2xl font-bold text-blue-600">{summaryCounters.medium}</span>
                                    <span className="text-[10px] text-blue-500 font-medium">Flags</span>
                                </div>
                            </div>
                            <div className="bg-white border border-slate-100 rounded-xl p-4 shadow-sm">
                                <span className="text-[11px] font-medium text-slate-500 uppercase tracking-wider">Flagged Works</span>
                                <div className="flex items-baseline gap-2 mt-1">
                                    <span className="text-2xl font-bold text-slate-900">{summaryCounters.distinctWorks}</span>
                                    <span className="text-[10px] text-slate-400 font-medium">Distinct Records</span>
                                </div>
                            </div>
                        </section>

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div className="bg-white border border-slate-200 rounded-xl shadow-sm flex flex-col h-[580px]">
                                <div className="p-4 border-b border-slate-100 bg-slate-50 shrink-0">
                                    <h2 className="font-semibold text-slate-900 text-xs tracking-wide uppercase">Weighted Division Risk Ranking</h2>
                                </div>
                                <div className="divide-y divide-slate-100 overflow-y-auto flex-1">
                                    {compiledDivisionsReport.map((div, i) => (
                                        <div 
                                            key={i} 
                                            onClick={() => setSelectedDivision(selectedDivision === div.name ? "ALL" : div.name)}
                                            className={`p-3.5 flex items-center justify-between cursor-pointer transition ${selectedDivision === div.name ? 'bg-blue-50/80 border-l-4 border-blue-600' : 'hover:bg-slate-50'}`}
                                        >
                                            <div className="space-y-1">
                                                <h3 className="font-semibold text-xs text-slate-800">{div.name}</h3>
                                                <div className="flex gap-1 text-[9px] font-bold">
                                                    <span className="px-1 bg-rose-50 text-rose-700 rounded">C:{div.critical}</span>
                                                    <span className="px-1 bg-amber-50 text-amber-700 rounded">H:{div.high}</span>
                                                    <span className="px-1 bg-blue-50 text-blue-700 rounded">M:{div.medium}</span>
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <span className="block text-xs font-bold text-slate-900">{div.score}</span>
                                                <span className="text-[9px] text-slate-400 block">{div.affectedWorks.size} items</span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="lg:col-span-2 flex flex-col space-y-4">
                                <div className="bg-white border border-slate-200 p-3 rounded-xl shadow-sm flex flex-col sm:flex-row gap-3 items-center shrink-0">
                                    <input 
                                        type="text" 
                                        placeholder="Fuzzy search across work names, keys, codes..."
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="w-full text-xs px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 focus:outline-none focus:ring-1 focus:ring-blue-500"
                                    />
                                    {selectedDivision !== "ALL" && (
                                        <button onClick={() => setSelectedDivision("ALL")} className="text-[11px] font-medium text-blue-600 bg-blue-50 hover:bg-blue-100 px-3 py-2 rounded-lg shrink-0 transition">
                                            Reset Filter ✕
                                        </button>
                                    )}
                                </div>

                                <div className="space-y-4 overflow-y-auto h-[510px] pr-1">
                                    {filteredWorksView.length === 0 ? (
                                        <div className="bg-white border border-slate-200 rounded-xl p-12 text-center text-slate-400 text-xs">
                                            No compliance exceptions discovered under current filter bounds.
                                        </div>
                                    ) : (
                                        filteredWorksView.map((work, idx) => (
                                            <div key={idx} className="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden border-l-4 border-slate-600">
                                                <div className="p-3 bg-slate-50 flex justify-between text-[10px] font-semibold text-slate-500 border-b border-slate-100">
                                                    <span>ID: {work.work_id} | Division: {work.division}</span>
                                                    <span>Head: {work.major_head || "UNCLASSIFIED"}</span>
                                                </div>
                                                <div className="p-4 space-y-3">
                                                    <h4 className="text-xs font-medium text-slate-900 leading-relaxed">{work.work_name}</h4>
                                                    <div className="space-y-2">
                                                        {work.identifiedFlags.map((flag, fIdx) => (
                                                            <div key={fIdx} className="p-3 bg-slate-50/70 border border-slate-100 rounded-lg text-xs">
                                                                <div className="flex justify-between items-center font-bold mb-1">
                                                                    <span className="text-slate-800">[{flag.id}] {flag.title}</span>
                                                                    <span className={`text-[9px] px-1.5 py-0.5 rounded ${flag.severity === 'CRITICAL' ? 'bg-rose-50 text-rose-700' : flag.severity === 'HIGH' ? 'bg-amber-50 text-amber-700' : 'bg-blue-50 text-blue-700'}`}>
                                                                        {flag.severity}
                                                                    </span>
                                                                </div>
                                                                <p className="text-slate-600 italic mb-1">{flag.details}</p>
                                                                <div className="text-[9px] text-slate-400 flex justify-between">
                                                                    <span>Rule: {flag.code}</span>
                                                                    <span>Source: {flag.source}</span>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        // Production-Grade React 18 Concurrent Root Mounting Strategy
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
